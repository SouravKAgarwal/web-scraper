[project]
name = "ai-scraper"
version = "0.1.0"
description = "A robust web scraper that extracts content as clean Markdown using Trafilatura and BeautifulSoup, with anti-bot bypass via curl_cffi."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "requests>=2.34.2",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
